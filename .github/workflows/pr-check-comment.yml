name: pr-check-comment

on:
  workflow_run:
    workflows: [check-changes]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-slim # lightweight: jq + gh api sticky comment
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Check PR comment
        uses: OpenShock/actions/pr-check-comment@0d33a0a518bd3b780329d8f363364e4a2a26b455 # v1.0.0
